# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Updates target the develop branch (next version); main only receives releases.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    ignore:
      # The Kotlin version has to match the stdlib bundled with the oldest supported IDE (since-build 252 = 2025.2
      # bundles Kotlin 2.1.20), see https://plugins.jetbrains.com/docs/intellij/using-kotlin.html
      # Raise it together with pluginSinceBuild in gradle.properties; patch releases stay enabled.
      - dependency-name: "org.jetbrains.kotlin.jvm"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
