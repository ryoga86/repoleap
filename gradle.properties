# ---------------------------------------------------------------------------------------------
# Plugin identity - the plugin ID can NOT be changed after the first Marketplace release.
# ---------------------------------------------------------------------------------------------
pluginGroup = de.pdenis.repoleap
pluginId = de.pdenis.repoleap
pluginName = RepoLeap
pluginVendor = Peter Denis
pluginVendorEmail = mail@pdenis.de
pluginRepositoryUrl = https://github.com/ryoga86/repoleap
pluginVersion = 1.0.0

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# 252 = IntelliJ Platform 2025.2. No until-build -> compatible with all newer IDEs until proven otherwise.
pluginSinceBuild = 252

# IntelliJ Platform used for compiling / runIde / tests (lowest supported version -> no accidental use of newer APIs)
platformVersion = 2025.2.6.3

# ---------------------------------------------------------------------------------------------
# Optional, machine specific - put these into ~/.gradle/gradle.properties (never into this file):
#   localIdePath = /Users/<you>/Applications/IntelliJ IDEA.app   -> `runLocalIde` task + verification against this IDE only
#   buildSearchableOptions = false                                -> faster local builds
#   repoleap.signing.certificateChainFile = /path/to/chain.crt     -> signing (alternative: env CERTIFICATE_CHAIN)
#   repoleap.signing.privateKeyFile = /path/to/private_encrypted.pem   (alternative: env PRIVATE_KEY)
#   repoleap.signing.password = ...                                    (alternative: env PRIVATE_KEY_PASSWORD)
#   repoleap.publishToken = perm:...                               -> Marketplace upload (alternative: env PUBLISH_TOKEN)
# ---------------------------------------------------------------------------------------------

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
